<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 登录账户</title>
    <meta name="keywords" content="用户登录, 登录, 账户, Toys Company Cn">
    <meta name="description" content="欢迎登录Toys Company Cn账户，输入您的用户名和密码即可继续。">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link type="text/css" rel="stylesheet" href="style3.css?version=2024011" media="screen" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        /* 🎨 全局样式与配色优化 - 橙色主题 */
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif;
            background-color: #fcf6f3;
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }

        .top-menu {
            background-color: #ff9800;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .top-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .top-menu ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .top-menu ul li a:hover {
            color: #f39c12;
            transform: translateY(-2px);
        }

        .top-menu ul li .icon {
            margin-right: 8px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        /* 登录页面特定样式 */
        .login-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            font-size: 28px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 25px;
            position: relative;
        }

        /* 登录表单样式 */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #ff9800;
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.2);
        }

        .input-group i {
            font-size: 20px;
            color: #999;
            margin-left: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            color: #333;
        }

        /* 密码输入框的眼睛图标样式 */
        .password-toggle {
            cursor: pointer;
            padding: 0 12px;
            color: #999;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #333;
        }

        /* 登录/注册/忘记密码链接容器 */
        .links-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link,
        .register-link,
        .forgot-password-link {
            color: #e67e22;
            text-decoration: none;
            transition: text-decoration 0.3s ease;
        }

        .login-link:hover,
        .register-link:hover,
        .forgot-password-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            background-color: #ff9800;
            color: #fff;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #f57c00;
            transform: translateY(-2px);
        }

        /* 提交按钮禁用时的样式 */
        .submit-btn:disabled {
            background-color: #cccccc; /* 灰色 */
            cursor: not-allowed;
            transform: translateY(0); /* 禁用时取消悬停效果 */
        }

        .bottom-section {
            background-color: #ff9800;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="top-menu">
        <ul>
            <li><a href="/index.php"><span class="icon">🏠</span>主页</a></li>
            <li><a href="/users/login.php" title="登录"><span class="icon">🔑</span>登录</a></li>
            <li><a href="/users/signup.php" title="注册"><span class="icon">📝</span>注册</a></li>
            <li><a href="/cart.php" id="cart-link" title="购物车"><span class="icon">🛒</span>购物车</a></li>
        </ul>
    </div>

    <div class="main-wrapper">
        <div class="login-container">
            <div class="login-card">
                <h2>账户登录</h2>
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-group">
                            <i class="ri-user-3-line"></i>
                            <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-group">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
                            <i class="ri-eye-line password-toggle" data-target="password"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">登录</button>
                    
                    <div class="links-container">
                        <a href="/users/forgot_password.php" class="forgot-password-link">忘记密码？</a>
                        <a href="/users/signup.php" class="register-link">立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        Registered Names and Trademarks are the copyright and property of their respective owners.
        &copy; 2024 Andyweiren Toy Store. All Rights Reserved.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 密码显示/隐藏切换功能
            const passwordToggles = document.querySelectorAll('.password-toggle');
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', (event) => {
                    const targetId = event.currentTarget.getAttribute('data-target');
                    const targetInput = document.getElementById(targetId);

                    if (targetInput.type === 'password') {
                        targetInput.type = 'text';
                        event.currentTarget.classList.remove('ri-eye-line');
                        event.currentTarget.classList.add('ri-eye-off-line');
                    } else {
                        targetInput.type = 'password';
                        event.currentTarget.classList.remove('ri-eye-off-line');
                        event.currentTarget.classList.add('ri-eye-line');
                    }
                });
            });

            // 表单提交验证和处理
            const loginForm = document.getElementById('login-form');
            const submitBtn = document.querySelector('.submit-btn');

            loginForm.addEventListener('submit', (event) => {
                // 阻止表单的默认提交行为
                event.preventDefault();

                // 获取用户名和密码
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                // 前端验证逻辑
                if (username === '' || password === '') {
                    alert('用户名和密码都不能为空！');
                    return; // 验证不通过，停止执行
                }
                
                // 如果前端验证通过，禁用按钮以防止重复提交
                submitBtn.disabled = true;
                submitBtn.innerText = '登录中...';
                
                // 手动提交表单
                const tempForm = document.createElement('form');
                tempForm.action = '/users/login_process.php';
                tempForm.method = 'POST';
                tempForm.style.display = 'none';

                const usernameInput = document.createElement('input');
                usernameInput.type = 'hidden';
                usernameInput.name = 'Username';
                usernameInput.value = username;
                tempForm.appendChild(usernameInput);

                const passwordInput = document.createElement('input');
                passwordInput.type = 'hidden';
                passwordInput.name = 'Password';
                passwordInput.value = password;
                tempForm.appendChild(passwordInput);

                document.body.appendChild(tempForm);
                tempForm.submit();
            });
        });
    </script>
</body>
</html>
