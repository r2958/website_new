<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人账户中心 - Toys Company Cn</title>
    <meta name="keywords" content="个人账户, 个人信息, 地址管理, 订单, Toys Company Cn">
    <meta name="description" content="管理您的个人信息、收货地址和查看历史订单。">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link type="text/css" rel="stylesheet" href="style3.css?version=2024011" media="screen" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        /* 🎨 全局样式与配色优化 - 橙色主题 */
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif;
            background-color: #fcf6f3;
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }

        .top-menu {
            background-color: #ff9800;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .top-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .top-menu ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .top-menu ul li a:hover {
            color: #f39c12;
            transform: translateY(-2px);
        }

        .top-menu ul li .icon {
            margin-right: 8px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        .account-container {
            display: flex;
            gap: 30px;
            padding: 30px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
        }

        .account-sidebar {
            flex: 0 0 250px;
            padding-right: 20px;
            border-right: 1px solid #e0e0e0;
        }

        .account-sidebar h3 {
            font-size: 20px;
            color: #e67e22;
            margin-bottom: 20px;
        }

        .account-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .account-sidebar ul li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #555;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }

        .account-sidebar ul li a i {
            font-size: 20px;
        }

        .account-sidebar ul li a:hover {
            background-color: #fcf6f3;
        }

        .account-sidebar ul li a.active {
            background-color: #ff9800;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
        }

        .account-content {
            flex-grow: 1;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .content-section.active {
            display: block;
        }

        .content-section h2 {
            font-size: 24px;
            color: #e67e22;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff9800;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-section {
            background-color: #ff9800;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .form-group button:hover {
            background-color: #e67e22;
        }

        /* 地址卡片样式 */
        .address-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .address-card h4 {
            margin-top: 0;
            color: #e67e22;
        }

        .address-card p {
            margin: 5px 0;
        }

        .address-card .actions {
            margin-top: 10px;
        }

        .address-card .actions button {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-right: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .address-card .actions button.delete {
            background-color: #e74c3c;
        }

        /* 订单表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #ffedd4;
            color: #e67e22;
        }

        tr:hover {
            background-color: #fdf6f0;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status.shipped {
            background-color: #d4edda;
            color: #155724;
        }

        .status.pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status.cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #ff9800;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff9800;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 错误提示 */
        .error {
            color: #e74c3c;
            padding: 10px;
            background-color: #fdf6f0;
            border: 1px solid #fadbd8;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="top-menu">
        <ul>
            <li><a href="/index.php"><span class="icon">🏠</span>主页</a></li>
            <li><a href="/users/login.php" title="登录"><span class="icon">🔑</span>登录</a></li>
            <li><a href="/users/signup.php" title="注册"><span class="icon">📝</span>注册</a></li>
            <li><a href="/cart.php" id="cart-link" title="购物车"><span class="icon">🛒</span>购物车</a></li>
        </ul>
    </div>

    <div class="main-wrapper">
        <div class="account-container">
            <aside class="account-sidebar">
                <h3>账户中心</h3>
                <ul>
                    <li><a href="#" class="nav-link active" data-target="profile"><i class="ri-user-line"></i>个人信息</a></li>
                    <li><a href="#" class="nav-link" data-target="address"><i class="ri-map-pin-line"></i>地址信息</a></li>
                    <li><a href="#" class="nav-link" data-target="orders"><i class="ri-shopping-bag-line"></i>订单列表</a></li>
                </ul>
            </aside>

            <main class="account-content">
                <!-- 个人信息 -->
                <section id="profile" class="content-section active">
                    <h2>个人信息</h2>
                    <div id="profile-content">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>加载中...</p>
                        </div>
                    </div>
                </section>

                <!-- 地址信息 -->
                <section id="address" class="content-section">
                    <h2>地址信息</h2>
                    <div id="address-content">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>加载中...</p>
                        </div>
                    </div>
                </section>

                <!-- 订单列表 -->
                <section id="orders" class="content-section">
                    <h2>订单列表</h2>
                    <div id="orders-content">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>加载中...</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="bottom-section">
        Registered Names and Trademarks are the copyright and property of their respective owners.
        &copy; 2024 Andyweiren Toy Store. All Rights Reserved.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-link');
            const contentSections = document.querySelectorAll('.content-section');

            // 模拟 AJAX 请求的工具函数
            function mockAjax(url, delay = 1000) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // 模拟不同的接口返回数据
                        if (url === '/api/profile') {
                            resolve({
                                username: '张三',
                                email: 'zhangsan@example.com',
                                phone: '13800138000',
                                avatar: '/avatar.jpg'
                            });
                        } else if (url === '/api/addresses') {
                            resolve([
                                {
                                    id: 1,
                                    name: '张三',
                                    phone: '13800138000',
                                    province: '广东省',
                                    city: '深圳市',
                                    district: '南山区',
                                    address: '科技园南区 123号',
                                    isDefault: true
                                },
                                {
                                    id: 2,
                                    name: '李四',
                                    phone: '13900139000',
                                    province: '北京市',
                                    city: '北京市',
                                    district: '朝阳区',
                                    address: '望京SOHO T1 501室',
                                    isDefault: false
                                }
                            ]);
                        } else if (url === '/api/orders') {
                            resolve([
                                {
                                    id: '10001',
                                    date: '2024-06-01',
                                    amount: 299.00,
                                    status: 'shipped',
                                    statusText: '已发货'
                                },
                                {
                                    id: '10002',
                                    date: '2024-06-05',
                                    amount: 129.50,
                                    status: 'pending',
                                    statusText: '待处理'
                                },
                                {
                                    id: '10003',
                                    date: '2024-05-28',
                                    amount: 599.00,
                                    status: 'cancelled',
                                    statusText: '已取消'
                                }
                            ]);
                        } else {
                            reject(new Error('接口不存在'));
                        }
                    }, delay);
                });
            }

            // 渲染个人信息
            function renderProfile(data) {
                return `
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" name="username" value="${data.username}">
                        </div>
                        <div class="form-group">
                            <label for="email">电子邮件</label>
                            <input type="email" id="email" name="email" value="${data.email}">
                        </div>
                        <div class="form-group">
                            <label for="phone">手机号</label>
                            <input type="tel" id="phone" name="phone" value="${data.phone}">
                        </div>
                        <div class="form-group">
                            <button type="submit">保存更改</button>
                        </div>
                    </form>
                `;
            }

            // 渲染地址信息
            function renderAddresses(data) {
                let html = '';
                data.forEach(addr => {
                    html += `
                        <div class="address-card">
                            <h4>${addr.isDefault ? '默认地址' : '备用地址'}</h4>
                            <p>${addr.province} ${addr.city} ${addr.district} ${addr.address}</p>
                            <p>收件人：${addr.name}</p>
                            <p>电话：${addr.phone}</p>
                            <div class="actions">
                                ${!addr.isDefault ? '<button class="set-default" data-id="' + addr.id + '">设为默认</button>' : ''}
                                <button class="edit" data-id="' + addr.id + '">编辑</button>
                                <button class="delete" data-id="' + addr.id + '">删除</button>
                            </div>
                        </div>
                    `;
                });
                html += '<button id="add-address" style="margin-top: 10px;">+ 添加新地址</button>';
                return html;
            }

            // 渲染订单列表
            function renderOrders(data) {
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>订单编号</th>
                                <th>下单时间</th>
                                <th>总金额</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.forEach(order => {
                    html += `
                        <tr>
                            <td>#${order.id}</td>
                            <td>${order.date}</td>
                            <td>¥${order.amount.toFixed(2)}</td>
                            <td><span class="status ${order.status}">${order.statusText}</span></td>
                        </tr>
                    `;
                });
                html += `
                        </tbody>
                    </table>
                `;
                return html;
            }

            // 加载数据的通用函数
            async function loadData(apiUrl, targetElement, renderFunction) {
                try {
                    const data = await mockAjax(apiUrl);
                    document.getElementById(targetElement).innerHTML = renderFunction(data);
                    
                    // 为个人信息表单添加提交事件
                    if (targetElement === 'profile-content') {
                        document.getElementById('profile-form').addEventListener('submit', function(e) {
                            e.preventDefault();
                            alert('个人信息已保存！');
                        });
                    }
                } catch (error) {
                    document.getElementById(targetElement).innerHTML = 
                        `<div class="error">加载失败: ${error.message}</div>`;
                }
            }

            // 导航切换逻辑
            navLinks.forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    navLinks.forEach(nav => nav.classList.remove('active'));
                    link.classList.add('active');
                    const targetId = link.getAttribute('data-target');
                    contentSections.forEach(section => section.classList.remove('active'));
                    document.getElementById(targetId).classList.add('active');

                    // 根据目标模块加载数据
                    switch(targetId) {
                        case 'profile':
                            loadData('/api/profile', 'profile-content', renderProfile);
                            break;
                        case 'address':
                            loadData('/api/addresses', 'address-content', renderAddresses);
                            break;
                        case 'orders':
                            loadData('/api/orders', 'orders-content', renderOrders);
                            break;
                    }
                });
            });

            // 初始加载个人信息
            loadData('/api/profile', 'profile-content', renderProfile);
        });
    </script>
</body>
</html>
