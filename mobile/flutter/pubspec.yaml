name: ibs_controls_shop
description: IBS Controls Shop - Flutter App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 网络请求
  dio: ^5.4.0
  
  # 状态管理
  provider: ^6.1.1
  
  # 本地存储
  shared_preferences: ^2.2.2

  # 图片加载
  cached_network_image: ^3.3.0
  
  # UI组件
  fluttertoast: ^8.2.4
  
  # 工具
  intl: ^0.18.1
  uuid: ^4.2.1
  
  # 骨架屏
  shimmer: ^3.0.0
  
  # 下拉刷新
  pull_to_refresh_flutter3: ^2.0.2
  
  # 图片预览
  photo_view: ^0.14.0
  
  # 路由管理
  go_router: ^13.0.0
  
  # 动画库
  flutter_staggered_animations: ^1.1.1
  
  # 支付宝支付
  alipay_kit: ^2.0.0
  
  # URL Scheme 处理
  uni_links: ^0.5.1
  
  # Apple Sign In
  sign_in_with_apple: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
