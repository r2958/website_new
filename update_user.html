<body>
    <div class="top-menu">

    <div class="main-wrapper">
        <div class="update-container">
            <div class="update-card">
                <h2>更新个人信息</h2>
                <form id="update-form" class="update-form" action="/users/update_profile.php" method="post">
                    
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-group">
                            <i class="ri-user-3-line"></i>
                            <input type="text" id="username" name="username" value="user123" readonly>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">电子邮件</label>
                        <div class="input-group">
                            <i class="ri-mail-line"></i>
                            <input type="email" id="email" name="email" value="user@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">手机号</label>
                        <div class="input-group">
                            <i class="ri-phone-line"></i>
                            <input type="tel" id="phone" name="phone" value="13812345678" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">收货地址</label>
                        <div class="input-group">
                            <i class="ri-map-pin-line"></i>
                            <input type="text" id="address" name="address" value="上海市浦东新区张江高科" required>
                        </div>
                    </div>

                    <h3>修改密码（可选）</h3>
                    <p class="password-tip">如果您不需要修改密码，请留空以下字段。</p>
                    <div class="form-group">
                        <label for="new-password">新密码</label>
                        <div class="input-group">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="new-password" name="new_password" placeholder="请输入新密码">
                            <i class="ri-eye-line password-toggle" data-target="new-password"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">确认新密码</label>
                        <div class="input-group">
                            <i class="ri-lock-2-line"></i>
                            <input type="password" id="confirm-password" name="confirm_password" placeholder="请再次输入新密码">
                            <i class="ri-eye-line password-toggle" data-target="confirm-password"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">保存修改</button>
                    <a href="#" class="back-link">返回个人中心</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 密码显示/隐藏切换功能
            const passwordToggles = document.querySelectorAll('.password-toggle');
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', (event) => {
                    const targetId = event.currentTarget.getAttribute('data-target');
                    const targetInput = document.getElementById(targetId);
                    
                    if (targetInput.type === 'password') {
                        targetInput.type = 'text';
                        event.currentTarget.classList.remove('ri-eye-line');
                        event.currentTarget.classList.add('ri-eye-off-line');
                    } else {
                        targetInput.type = 'password';
                        event.currentTarget.classList.remove('ri-eye-off-line');
                        event.currentTarget.classList.add('ri-eye-line');
                    }
                });
            });

            // 表单验证，确保两次密码输入一致
            const updateForm = document.getElementById('update-form');
            updateForm.addEventListener('submit', (event) => {
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // 只有在填写了新密码时才进行验证
                if (newPassword && newPassword !== confirmPassword) {
                    alert('两次输入的新密码不一致，请重新输入！');
                    event.preventDefault(); // 阻止表单提交
                    return false;
                }
            });
        });
    </script>
