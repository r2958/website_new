<body>
    <div class="top-menu">

    <div class="main-wrapper">
        <div class="login-container">
            <div class="login-card">
                <h2>账户登录</h2>
                <form id="login-form" class="login-form" action="/users/login_process.php" method="post">
                    
                    <div class="form-group">
                        <label for="username">用户名 / 邮箱</label>
                        <div class="input-group">
                            <i class="ri-user-3-line"></i>
                            <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-group">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="password" name="password" placeholder="请输入密码" required>
                            <i class="ri-eye-line password-toggle" data-target="password"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">登录</button>
                    
                    <div class="links-container">
                        <a href="/users/signup.php">没有账户？立即注册</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 密码显示/隐藏切换功能
            const passwordToggles = document.querySelectorAll('.password-toggle');
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', (event) => {
                    const targetId = event.currentTarget.getAttribute('data-target');
                    const targetInput = document.getElementById(targetId);
                    
                    if (targetInput.type === 'password') {
                        targetInput.type = 'text';
                        event.currentTarget.classList.remove('ri-eye-line');
                        event.currentTarget.classList.add('ri-eye-off-line');
                    } else {
                        targetInput.type = 'password';
                        event.currentTarget.classList.remove('ri-eye-off-line');
                        event.currentTarget.classList.add('ri-eye-line');
                    }
                });
            });
        });
    </script>
</body>
